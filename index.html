<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>최윤예 | 소개 페이지</title>
  <style>
    /* 페이지 전체 배경과 기본 글씨 설정 */
    body {
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background-color: #eef5f3;
      color: #333333;
      margin: 0;
      padding: 40px 20px;
    }

    /* 내용을 담는 가운데 카드 박스 */
    .card {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    /* 큰 제목 (이름) */
    h1 {
      text-align: center;
      color: #2e8b78;
      margin-bottom: 8px;
    }

    /* 한 줄 소개 */
    .tagline {
      text-align: center;
      color: #777777;
      margin-top: 0;
      margin-bottom: 32px;
    }

    /* 소제목 */
    h2 {
      color: #2e8b78;
      border-bottom: 2px solid #eef5f3;
      padding-bottom: 8px;
      margin-top: 32px;
    }

    /* 관심사 목록 */
    ul {
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>최윤예</h1>
    <p class="tagline">환자를 따뜻하게 돌보는 마음을 가진 간호사입니다.</p>

    <h2>소개</h2>
    <p>
      안녕하세요, 최윤예입니다. 사람을 돌보는 일에 보람을 느끼는 간호사이며,
      환자분들과 따뜻하게 소통하는 것을 가장 소중하게 생각합니다.
      요즘은 새로운 도전으로 코딩을 배우고 있습니다.
    </p>

    <h2>관심사</h2>
    <ul>
      <li>독서</li>
      <li>커피</li>
      <li>여행</li>
      <li>코딩 공부</li>
    </ul>

    <h2>연락처</h2>
    <p>이메일: yeyechoi2902@gmail.com</p>
  </div>
</body>
</html>
